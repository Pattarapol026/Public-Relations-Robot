  <style>
    :root { --bg:#07111e; --card:#0e1c2c; --card2:#102235; --line:#284057; --cyan:#5de2f2; --blue:#428fff; --green:#53d9a1; --amber:#f3bd61; --red:#ff6977; --muted:#91aabd; }
    * { box-sizing:border-box }
    html { scroll-behavior:smooth }
    body { margin:0; width:100%; min-width:320px; font-family:'DM Sans',sans-serif; color:#e8f4fb; background:#07111e }
    button,input,textarea,select { font:inherit }
    button { cursor:pointer }
    button:disabled { opacity:.43; cursor:not-allowed }
    :focus-visible { outline:2px solid var(--cyan); outline-offset:3px }
    .mono { font-family:'Space Mono',monospace }
    .shell { width:100%; min-height:calc(100 * min(var(--vh, 1vh), 1vh)); background:radial-gradient(ellipse at 52% 11%,#112d40 0%,transparent 44%),linear-gradient(90deg,#ffffff06 1px,transparent 1px),linear-gradient(#ffffff06 1px,transparent 1px),#07111e; background-size:auto,36px 36px,36px 36px,auto }
    .app-inner { max-width:1720px; margin:auto; padding:20px clamp(14px,2vw,32px) 34px }
    .panel { background:rgba(13,28,44,.92); border:1px solid var(--line); border-radius:16px; box-shadow:0 16px 48px #00000024; backdrop-filter:blur(12px) }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 19px 13px; border-bottom:1px solid #20374b }
    .eyebrow { letter-spacing:.16em; font-size:10px; font-weight:700; color:var(--cyan); text-transform:uppercase }
    .muted { color:var(--muted) }
    .dashboard-grid { display:grid; grid-template-columns:minmax(255px, .86fr) minmax(360px,1.55fr) minmax(290px,1fr); gap:15px; align-items:stretch }
    .field { width:100%; background:#091827; border:1px solid #365067; color:#e8f4fb; border-radius:9px; padding:11px 12px; outline:none }
    .field:focus { border-color:var(--cyan); box-shadow:0 0 0 3px #5de2f223 }
    .field::placeholder { color:#7290a6 }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:39px; padding:9px 13px; border-radius:9px; font-weight:700; font-size:12px; line-height:1.3; transition:transform .18s,filter .18s,background .18s; border:1px solid transparent }
    .btn:not(:disabled):hover { transform:translateY(-2px); filter:brightness(1.13) }
    .btn-primary { background:var(--cyan); color:#06202d }
    .btn-secondary { background:#19334a; border-color:#365775; color:#daf4ff }
    .btn-amber { background:#594323; border-color:#a87a36; color:#ffe2a5 }
    .btn-red { background:#542632; border-color:#a34b5a; color:#ffdce0 }
    .tag { display:inline-flex; align-items:center; gap:7px; border-radius:100px; border:1px solid #3b596c; background:#122a3b; padding:6px 10px; font-size:10px; font-weight:700; letter-spacing:.07em; white-space:nowrap }
    .dot { width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;flex:none }
    .status-safe { color:var(--green) } .status-wait { color:var(--amber) } .status-danger { color:var(--red) } .status-info { color:var(--cyan) }
    .method-grid { display:grid;grid-template-columns:1fr 1fr;gap:7px }
    .method { border:1px solid #365067;background:#102235;color:#aac4d6;border-radius:9px;min-height:43px;padding:7px;font-size:11px;font-weight:700 }
    .method.selected { border-color:var(--cyan);background:#123d51;color:#a9f6ff;box-shadow:inset 0 0 0 1px #5de2f255 }
    .metric { border:1px solid #284257;background:#0c2030;border-radius:11px;padding:12px }
    .robot-stage { position:relative; min-height:470px; display:flex;align-items:center;justify-content:center;overflow:hidden; background:radial-gradient(circle at 50% 47%,#19475a75,transparent 48%),linear-gradient(90deg,#75d9f20b 1px,transparent 1px),linear-gradient(#75d9f20b 1px,transparent 1px);background-size:auto,24px 24px,24px 24px }
    .robot-stage::after { content:'';position:absolute;bottom:22px;width:53%;height:15px;background:#000b12;border-radius:50%;filter:blur(12px) }
    .radar { position:absolute;width:370px;height:370px;max-width:90%;aspect-ratio:1;border:1px solid #48b8d330;border-radius:50%;box-shadow:0 0 0 55px #48b8d30b,0 0 0 110px #48b8d307;animation:pulse 3s ease-in-out infinite }
    .radar::after { content:'';position:absolute;inset:12%;border:1px dashed #5de2f235;border-radius:50% }
    .radar-sweep { position:absolute;width:340px;height:340px;max-width:85%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 295deg,#5de2f222 345deg,#5de2f255 360deg);animation:spin 5s linear infinite }

    .stage-label { position:absolute;z-index:3;background:#091c2bd9;border:1px solid #387087;border-radius:7px;padding:6px 8px;font-size:9px;letter-spacing:.03em;color:#a5eaf4 }
    .stage-label.left { left:20px;top:29% } .stage-label.right { right:19px;top:54% }

    .pipeline-step.active { border-color:var(--cyan);background:#143546;color:#d5fbff }
    .pipeline-step.done { border-color:var(--green);color:#9aeac9 }
    .map { position:relative;height:181px;overflow:hidden;border-radius:10px;border:1px solid #345569;background:linear-gradient(90deg,#5de2f212 1px,transparent 1px),linear-gradient(#5de2f212 1px,transparent 1px),#071d2d;background-size:22px 22px }
    .map svg { position:absolute;inset:0;width:100%;height:100% }
    .obstacle { position:absolute;top:42%;left:53%;width:22px;height:22px;background:#ff6977;border:3px solid #ffd1d7;box-shadow:0 0 20px #ff6977;border-radius:5px;transform:rotate(14deg) }
    .map-robot { position:absolute;bottom:17%;left:20%;width:22px;height:22px;background:#5de2f2;border:4px solid #b5f8ff;border-radius:50%;box-shadow:0 0 17px #5de2f2;transition:left .8s,bottom .8s }
    .map-robot.moving { left:42%;bottom:40% }
    .timeline-item { position:relative;padding:0 0 13px 18px;border-left:1px solid #345064;font-size:11px }
    .timeline-item::before { content:'';position:absolute;left:-4px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan) }
    .timeline-item.danger::before { background:var(--red);box-shadow:0 0 9px var(--red) }
    .timeline-item:last-child { border-color:transparent;padding-bottom:0 }
    .scroll-pane { max-height:239px;overflow:auto;scrollbar-color:#35566a transparent }
    .step-dot { width:7px;height:7px;border-radius:50%;background:#456377;flex:none }
    .pipeline-step.active .step-dot { background:var(--cyan);box-shadow:0 0 12px var(--cyan) }
    .pipeline-step.done .step-dot { background:var(--green) }
    input[type=range] { width:100%;accent-color:#5de2f2;cursor:pointer }
    .divider { border-top:1px solid #254054 }
    .lower-grid { display:grid;grid-template-columns:1.1fr .85fr 1.15fr;gap:15px;margin-top:15px }
    .kb-entry { border:1px solid #2a4457;border-radius:8px;padding:9px;background:#0a1b2a }
    @media(max-width:1200px){ .dashboard-grid { grid-template-columns:minmax(235px,.9fr) minmax(330px,1.3fr) } .monitor { grid-column:1 / -1 } .monitor-content { display:grid;grid-template-columns:1fr 1fr;gap:18px } .lower-grid { grid-template-columns:1fr 1fr } .knowledge { grid-column:1/-1 } }
    @media(max-width:700px){ .app-inner { padding:12px 12px 25px } .dashboard-grid,.lower-grid { grid-template-columns:1fr } .monitor,.knowledge { grid-column:auto } .monitor-content { display:block } .robot-stage { min-height:390px } .header-line { align-items:flex-start!important } .header-actions { justify-content:flex-start!important } .stage-label { font-size:8px } }
    @media(prefers-reduced-motion:reduce){ *,*::before,*::after { animation-duration:.01ms!important;transition-duration:.01ms!important } }

  <script type="module">
    import React, { useEffect, useRef, useState } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';

    // React owns simulation state; the static dashboard remains usable while CDN modules load.
    const h = React.createElement;
    const initialKnowledge = [
      { id: 1, question: 'ห้องประชุมอยู่ที่ไหน', answer: 'ห้องประชุมอยู่ชั้น 2 ทางเดินด้านขวาหลังเคาน์เตอร์ต้อนรับ' },
      { id: 2, question: 'What are the opening hours?', answer: 'Reception is open Monday to Friday, 09:00–17:00.' }
    ];
    const stages = ['SYSTEM READY','PERSON DETECTED','LISTENING','AI PROCESSING','MULTIMODAL INPUT','COMMAND CONFIRMATION','NAVIGATING','SAFETY STOP','ADMIN UPDATE','SIMULATION COMPLETE'];
    const $ = id => document.getElementById(id);
    const formatTime = () => new Date().toLocaleTimeString('th-TH', {hour12:false});
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function App() {
      const [state, setState] = useState('SYSTEM READY');
      const [distance, setDistance] = useState(4);
      const [method, setMethod] = useState('Voice');
      const [obstacle, setObstacle] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const [pending, setPending] = useState(false);
      const [busy, setBusy] = useState(false);
      const [demo, setDemo] = useState(false);
      const [pipeline, setPipeline] = useState(-1);
      const [knowledge, setKnowledge] = useState(initialKnowledge);
      const [visitors, setVisitors] = useState(0);
      const [conversations, setConversations] = useState(0);
      const [unanswered, setUnanswered] = useState(0);
      const [events, setEvents] = useState([{ id:0, time:formatTime(), state:'SYSTEM READY', detail:'ระบบจำลองพร้อมใช้งาน / Simulation initialized' }]);
      const [message, setMessage] = useState('');
      const [answer, setAnswer] = useState('');
      const runRef = useRef(0);
      const eventId = useRef(1);
      const distanceRef = useRef(4);
      const obstacleRef = useRef(false);
      const confirmedRef = useRef(false);
      const knowledgeRef = useRef(initialKnowledge);
      const eventsRef = useRef([]);
      const demoRef = useRef(false);
      const busyRef = useRef(false);

      function log(next, detail) {
        setState(next);
        setEvents(old => [{id:eventId.current++,time:formatTime(),state:next,detail},...old].slice(0,40));
      }
      function setVisitorDistance(raw) {
        const value = Number(raw);
        const previous = distanceRef.current;
        distanceRef.current = value;
        setDistance(value);
        if (value <= 3 && previous > 3) {
          setVisitors(n => n + 1);
          log('PERSON DETECTED','OAK-D ตรวจพบผู้มาเยือนในระยะ 3.0 m');
        }
        if (value <= 1.5 && previous > 1.5) log('LISTENING','เปิดไมโครโฟนอัตโนมัติในระยะ 1.5 m');
        if (value > 1.5 && previous <= 1.5 && value <= 3) log('PERSON DETECTED','ผู้มาเยือนออกจากระยะไมโครโฟน');
        if (value > 3 && previous <= 3) log('SYSTEM READY','ผู้มาเยือนออกจากพื้นที่ตรวจจับ');
      }
      function selectMethod(value) {
        setMethod(value);
        if (distanceRef.current <= 3) log('MULTIMODAL INPUT',`เลือกช่องทางรับข้อมูล: ${value}`);
        else setMessage('เลือกรูปแบบแล้ว • เลื่อน Visitor Distance ให้ไม่เกิน 3.0 m เพื่อเริ่ม');
      }
      async function processQuestion(question, token = runRef.current) {
        if (busyRef.current) return false;
        if (distanceRef.current > 3) { setMessage('กรุณาเลื่อนผู้มาเยือนเข้ามาในระยะตรวจจับ ≤ 3.0 m'); return false; }
        if (!question.trim()) { setMessage('กรุณากรอกคำถามก่อนเริ่ม AI Pipeline'); return false; }
        busyRef.current = true; setBusy(true); setAnswer(''); setMessage('');
        log('AI PROCESSING','เริ่มประมวลผลคำถามด้วย AI Pipeline จำลอง');
        for (let i=0;i<6;i++) {
          if (token !== runRef.current) return false;
          setPipeline(i);
          await wait(390);
        }
        if (token !== runRef.current) return false;
        const query = question.trim().toLocaleLowerCase();
        const found = knowledgeRef.current.find(item => item.question.toLocaleLowerCase() === query || query.includes(item.question.toLocaleLowerCase()));
        if (found) { setAnswer(found.answer); setConversations(n => n+1); log('MULTIMODAL INPUT','ตอบคำถามจาก Knowledge Base ผ่าน Thai/English TTS จำลอง'); }
        else { setAnswer('ยังไม่พบคำตอบใน Knowledge Base กรุณาติดต่อเจ้าหน้าที่ต้อนรับ / No matching knowledge entry found.'); setUnanswered(n => n+1); log('MULTIMODAL INPUT','ไม่พบคำตอบที่ตรงกันใน Knowledge Base'); }
        setPipeline(6); busyRef.current=false; setBusy(false);
        return true;
      }
      function requestNavigation() {
        if (distanceRef.current > 3) { setMessage('ต้องตรวจพบผู้มาเยือนก่อนขอคำสั่งนำทาง'); return; }
        setPending(true); setMessage('');
        log('COMMAND CONFIRMATION','รอผู้ใช้ยืนยันคำสั่งก่อนหุ่นยนต์เคลื่อนที่');
      }
      function confirmNavigation() {
        if (!pending || obstacleRef.current) return;
        setPending(false); setConfirmed(true); confirmedRef.current=true;
        log('NAVIGATING','ผู้ใช้ยืนยันแล้ว • ROS2 Nav2 เริ่มนำทางจำลอง');
      }
      function addObstacle() {
        if (obstacleRef.current) { setMessage('มีสิ่งกีดขวางอยู่แล้ว • กด Clear Path เพื่อนำออก'); return; }
        obstacleRef.current=true; setObstacle(true);setPending(false);
        log('SAFETY STOP','RPLiDAR พบสิ่งกีดขวางระยะ 0.5 m ≤ 0.7 m • Emergency Stop');
      }
      function clearPath() {
        if (!obstacleRef.current) { setMessage('เส้นทางปลอดภัยอยู่แล้ว / Path is clear'); return; }
        obstacleRef.current=false;setObstacle(false);
        log('SAFETY STOP','นำสิ่งกีดขวางออกแล้ว • รอกด Resume Navigation');
      }
      function resume() {
        if (obstacleRef.current) { setMessage('ยังมีสิ่งกีดขวาง • กด Clear Path ก่อน'); return; }
        if (!confirmedRef.current) { setMessage('ต้องยืนยันคำสั่งนำทางก่อนกด Resume'); return; }
        setMessage('');
        log('NAVIGATING','เส้นทางปลอดภัย • ดำเนินการนำทางต่อ');
      }
      function addKnowledge(event) {
        event.preventDefault();
        const question=$('kb-question').value.trim(), response=$('kb-answer').value.trim();
        if (!question || !response) return;
        const next=[...knowledgeRef.current,{id:Date.now(),question,answer:response}];
        knowledgeRef.current=next;setKnowledge(next);
        $('knowledge-form').reset();
        setMessage('เพิ่มคำตอบลง Knowledge Base แล้ว');
        log('ADMIN UPDATE',`เพิ่มคำตอบใหม่: ${question}`);
      }
      function reset() {
        runRef.current++;
        demoRef.current=false;busyRef.current=false;distanceRef.current=4;obstacleRef.current=false;confirmedRef.current=false;knowledgeRef.current=initialKnowledge;
        setDemo(false);setBusy(false);setState('SYSTEM READY');setDistance(4);setMethod('Voice');setObstacle(false);setConfirmed(false);setPending(false);setPipeline(-1);setKnowledge(initialKnowledge);setVisitors(0);setConversations(0);setUnanswered(0);setAnswer('');setMessage('');
        $('question').value='';$('knowledge-form').reset();
        setEvents([{id:eventId.current++,time:formatTime(),state:'SYSTEM READY',detail:'รีเซ็ตสถานะและข้อมูลจำลองแล้ว'}]);
      }
      async function autoDemo() {
        if (demoRef.current) { runRef.current++;demoRef.current=false;busyRef.current=false;setDemo(false);setBusy(false);setPipeline(-1);setMessage('หยุด Auto Demo แล้ว');return; }
        reset();
        const token=runRef.current;
        demoRef.current=true;setDemo(true);
        const next=async(ms=850)=>{await wait(ms);return runRef.current===token};
        if (!await next(550)) return;
        setVisitorDistance(2.7);
        if (!await next()) return;
        setVisitorDistance(1.2);
        if (!await next()) return;
        $('question').value='ห้องประชุมอยู่ที่ไหน';
        if (!await processQuestion('ห้องประชุมอยู่ที่ไหน',token)) return;
        if (!await next()) return;
        selectMethod('Touchscreen');
        if (!await next()) return;
        setPending(true);log('COMMAND CONFIRMATION','Auto Demo: รอการยืนยันคำสั่งนำทางจำลอง');
        if (!await next()) return;
        setPending(false);setConfirmed(true);confirmedRef.current=true;log('NAVIGATING','Auto Demo: ยืนยันคำสั่งและเริ่มนำทาง');
        if (!await next()) return;
        addObstacle();
        if (!await next()) return;
        clearPath();
        if (!await next(500)) return;
        resume();
        if (!await next()) return;
        const nextKB=[...knowledgeRef.current,{id:Date.now(),question:'Where is the reception desk?',answer:'The reception desk is at the main entrance on the ground floor.'}];
        knowledgeRef.current=nextKB;setKnowledge(nextKB);log('ADMIN UPDATE','Auto Demo: เพิ่มข้อมูลใหม่ใน Knowledge Base');
        if (!await next()) return;
        log('SIMULATION COMPLETE','ลำดับการทำงานจำลองครบทุกขั้นตอน');
        demoRef.current=false;setDemo(false);
      }

      useEffect(() => {
        const listeners = [
          ['distance','input',e=>setVisitorDistance(e.target.value)],
          ['ask-button','click',()=>processQuestion($('question').value)],
          ['request-button','click',requestNavigation],
          ['confirm-button','click',confirmNavigation],
          ['obstacle-button','click',addObstacle],
          ['clear-button','click',clearPath],
          ['resume-button','click',resume],
          ['reset-button','click',reset],
          ['demo-button','click',autoDemo],
          ['knowledge-form','submit',addKnowledge]
        ];
        listeners.forEach(([id,event,handler])=>$(id).addEventListener(event,handler));
        const methodsHandler=e=>{const button=e.target.closest('[data-method]');if(button) selectMethod(button.dataset.method)};
        $('methods').addEventListener('click',methodsHandler);
        const tick=()=>{$('clock').textContent=formatTime()};
        tick();const timer=setInterval(tick,1000);
        return ()=>{listeners.forEach(([id,event,handler])=>$(id).removeEventListener(event,handler));$('methods').removeEventListener('click',methodsHandler);clearInterval(timer)};
      },[pending]);

      useEffect(()=>{
        $('distance').value=distance;
        $('distance-value').textContent=distance.toFixed(1)+' m';
        $('status-text').textContent=state;
        $('status-badge').className='tag '+(state==='SAFETY STOP'?'status-danger':state==='NAVIGATING'||state==='PERSON DETECTED'||state==='LISTENING'||state==='SIMULATION COMPLETE'?'status-safe':state==='COMMAND CONFIRMATION'?'status-wait':'status-info');
        $('mic-state').textContent=distance<=1.5?'MIC ACTIVE':'MIC OFF';
        $('mic-state').className='tag '+(distance<=1.5?'status-safe':'status-wait');
        $('vision-status').textContent=distance<=3?'PERSON DETECTED':'SCANNING';
        $('vision-status').className=distance<=3?'status-safe text-xs':'status-wait text-xs';
        $('lidar-status').textContent=obstacle?'STOP • 0.5 m':'CLEAR';
        $('lidar-status').className=obstacle?'status-danger text-xs':'status-safe text-xs';
        $('obstacle-distance').textContent=obstacle?'0.5 m / STOP':'CLEAR';
        $('obstacle-distance').className='mono '+(obstacle?'status-danger':'status-safe');
        $('map-obstacle').classList.toggle('hidden',!obstacle);
        $('map-robot').classList.toggle('moving',state==='NAVIGATING');
        $('confirm-button').disabled=!pending||obstacle||demo;
        $('ask-button').disabled=busy||demo;
        $('request-button').disabled=demo||busy;
        $('resume-button').disabled=demo;
        $('obstacle-button').disabled=demo;
        $('clear-button').disabled=demo;
        $('demo-button').textContent=demo?'Stop Auto Demo':'▶ Auto Demo Mode';
        $('gateway-note').textContent=pending?'รอการยืนยันจากผู้ใช้ / Awaiting confirmation':confirmed?'คำสั่งได้รับการยืนยันแล้ว / Command authorized':'รอคำสั่งนำทาง / Awaiting command';
        $('methods').querySelectorAll('[data-method]').forEach(button=>{const selected=button.dataset.method===method;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))});
        $('pipeline').querySelectorAll('[data-step]').forEach((item,i)=>{item.classList.toggle('active',pipeline===i);item.classList.toggle('done',pipeline>i)});
        $('response-box').classList.toggle('hidden',!answer);
        $('response-text').textContent=answer;
        $('kb-message').textContent=message;
        $('visitors-count').textContent=visitors;
        $('conversations-count').textContent=conversations;
        $('unanswered-count').textContent=unanswered;
        $('response-time').textContent=conversations?'2.3s':'—';
        $('knowledge-count').textContent=knowledge.length+' ENTRIES';
      },[state,distance,method,obstacle,pending,confirmed,busy,demo,pipeline,answer,knowledge,visitors,conversations,unanswered,message]);

      useEffect(()=>{
        const list=$('timeline');
        const known=new Map([...list.children].map(el=>[Number(el.dataset.eventId),el]));
        events.forEach(event=>{
          let el=known.get(event.id);
          if(!el){
            el=document.createElement('div');el.dataset.eventId=event.id;el.className='timeline-item'+(event.state==='SAFETY STOP'?' danger':'');
            const top=document.createElement('div');top.className='flex justify-between gap-2';
            const title=document.createElement('strong');title.className='mono status-info';title.textContent=event.state;
            if(event.state==='SAFETY STOP')title.className='mono status-danger';
            const time=document.createElement('time');time.className='mono muted';time.textContent=event.time;
            top.append(title,time);
            const description=document.createElement('p');description.className='muted mt-1';description.textContent=event.detail;
            el.append(top,description);
          }
          list.appendChild(el);known.delete(event.id);
        });
        known.forEach(el=>el.remove());
        [...list.children].reverse().forEach(el=>list.prepend(el));
      },[events]);

      useEffect(()=>{
        const list=$('knowledge-list');
        const known=new Map([...list.children].map(el=>[Number(el.dataset.entryId),el]));
        knowledge.forEach(entry=>{
          let el=known.get(entry.id);
          if(!el){el=document.createElement('div');el.dataset.entryId=entry.id;el.className='kb-entry';const q=document.createElement('p');q.className='text-xs font-semibold status-info';q.textContent=entry.question;const a=document.createElement('p');a.className='text-xs muted mt-1';a.textContent=entry.answer;el.append(q,a);list.appendChild(el)}
          known.delete(entry.id);
        });
        known.forEach(el=>el.remove());
      },[knowledge]);
      return null;
    }
    createRoot(document.createElement('div')).render(h(App));
    if(window.lucide) window.lucide.createIcons();
  </script>
 </body>
</html>
